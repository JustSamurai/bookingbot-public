name: Deploy VK Bot via Docker
# попытка № 5
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: production-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy and Restart Docker
        run: |
          cd ~/bookingbot-public
          git pull origin main
          docker compose up -d --build
